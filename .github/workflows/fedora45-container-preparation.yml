# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Fedora45 container preparation
run-name: 'Fedora45 preparation [prepare:${{ inputs.run_id }}]'

on:
  workflow_dispatch:
    inputs:
      source_snapshot:
        description: Exact latest-source snapshot resolved once by n8n after the upstream update gate
        required: true
        type: string
      run_id:
        description: n8n execution correlation ID
        required: true
        type: string
      validate_only:
        description: Test both current target runtimes without publishing pin changes
        required: true
        type: boolean
        default: false

concurrency:
  group: fedora45-container-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(inputs.source_snapshot).source_commit }}
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Configure private repository access
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: gh auth setup-git
      - name: Prepare and test exact build inputs
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          SOURCE_SNAPSHOT_JSON: ${{ inputs.source_snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$VALIDATE_ONLY" = true ]; then flags+=(--validate-only); fi
          python3 -c 'import os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "source-snapshot.json").write_text(os.environ["SOURCE_SNAPSHOT_JSON"])'
          python3 upgrade-loop/prepare-container.py "${flags[@]}" \
            --source-snapshot "$RUNNER_TEMP/source-snapshot.json" \
            --report "$RUNNER_TEMP/container-preparation.json"
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-preparation
          path: ${{ runner.temp }}/container-preparation.json
          if-no-files-found: error
