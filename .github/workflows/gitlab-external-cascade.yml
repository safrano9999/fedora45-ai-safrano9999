name: GitLab Fedora45 cascade via external runner

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Fixed image tag
        required: true
        default: "2026.9.17.4"
        type: string
      build_commit:
        description: Exact prepared source commit
        required: true
        default: "7bf02785ca7d2b32036e5bb5a16beb03537d36db"
        type: string

permissions:
  contents: read

jobs:
  gitlab-cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    env:
      GITLAB_PROJECT: rafaelfelixremy/fedora45-ai-safrano9999
      GITLAB_API: https://gitlab.com/api/v4
      TARGET_TAG: ${{ inputs.target_tag }}
      BUILD_COMMIT: ${{ inputs.build_commit }}
      CASCADE_TARGET: fedora45-ai-safrano9999
    steps:
      - name: Install GitLab Runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-amd64 \
            -o /tmp/gitlab-runner
          sudo install -m 0755 /tmp/gitlab-runner /usr/local/bin/gitlab-runner
          gitlab-runner --version

      - name: Register temporary external runner
        shell: bash
        env:
          GITLAB_RUNNER_TOKEN: ${{ secrets.GITLAB_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_RUNNER_TOKEN"
          sudo gitlab-runner register --non-interactive \
            --config /etc/gitlab-runner/config.toml \
            --url https://gitlab.com \
            --token "$GITLAB_RUNNER_TOKEN" \
            --name github-hosted-fedora45-cascade \
            --executor docker \
            --docker-image docker:27.5.1 \
            --docker-privileged

      - name: Trigger GitLab pipeline
        id: pipeline
        shell: bash
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_API_TOKEN"
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          project_id="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$GITLAB_PROJECT")"
          payload="$(jq -nc --arg ref main --arg tag "$TARGET_TAG" --arg target "$CASCADE_TARGET" --arg commit "$BUILD_COMMIT" \
            '{ref:$ref,variables:[{key:"TARGET_TAG",value:$tag},{key:"CASCADE_TARGET",value:$target},{key:"BUILD_COMMIT",value:$commit}]}')"
          response="$(curl --fail --silent --show-error --request POST \
            --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$GITLAB_API/projects/$project_id/pipeline")"
          pipeline_id="$(jq -r .id <<<"$response")"
          test "$pipeline_id" != null
          echo "pipeline_id=$pipeline_id" >> "$GITHUB_OUTPUT"
          echo "GitLab pipeline $pipeline_id dispatched"

      - name: Run temporary runner and wait for GitLab
        shell: bash
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
        run: |
          set -euo pipefail
          project_id="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$GITLAB_PROJECT")"
          sudo gitlab-runner run --config /etc/gitlab-runner/config.toml >/tmp/gitlab-runner.log 2>&1 &
          runner_pid=$!
          cleanup() {
            kill "$runner_pid" 2>/dev/null || true
            wait "$runner_pid" 2>/dev/null || true
            sudo gitlab-runner unregister --all-runners --config /etc/gitlab-runner/config.toml >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 1560); do
            response="$(curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
              "$GITLAB_API/projects/$project_id/pipelines/$PIPELINE_ID")"
            status="$(jq -r .status <<<"$response")"
            echo "GitLab pipeline status: $status"
            case "$status" in
              success) exit 0 ;;
              failed|canceled|skipped|manual) cat /tmp/gitlab-runner.log; exit 1 ;;
            esac
            sleep 15
          done
          cat /tmp/gitlab-runner.log
          echo 'GitLab pipeline timed out' >&2
          exit 1
