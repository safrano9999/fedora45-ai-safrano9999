name: Retag completed Fedora45 cascade
on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      build_commit:
        description: Exact source revision shared by all six completed images
        required: true
        type: string
concurrency:
  group: fedora45-retag-cascade
  cancel-in-progress: false
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify entire cascade, then copy exact manifests without rebuilding
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$TARGET_TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$SOURCE_TAG" != "$TARGET_TAG" && "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          declare -A digests
          stages=(core-pre core base kachelmann safrano9999 safrano9999-full)
          for stage in "${stages[@]}"; do
            image="ghcr.io/safrano9999/fedora45-ai-$stage"
            digest="$(docker buildx imagetools inspect "$image:$SOURCE_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$image@$digest" --format '{{json .Image}}' |
              jq -e --arg revision "$BUILD_COMMIT" '(.config // .["linux/amd64"].config).Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
            digests[$stage]="$digest"
          done
          for stage in "${stages[@]}"; do
            image="ghcr.io/safrano9999/fedora45-ai-$stage"
            docker buildx imagetools create --prefer-index=false --tag "$image:$TARGET_TAG" "$image@${digests[$stage]}"
            actual="$(docker buildx imagetools inspect "$image:$TARGET_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$actual" == "${digests[$stage]}" ]]
            printf '%s:%s → %s\n' "$image" "$TARGET_TAG" "$actual" >> "$GITHUB_STEP_SUMMARY"
          done
