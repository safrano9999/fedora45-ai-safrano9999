name: Retag completed Fedora45 cascade
on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      core_pre_only:
        description: Retag only the unchanged Core-pre foundation before rebuilding Core and above
        type: boolean
        default: false
      build_commit:
        description: Exact source revision of completed Core and Base
        required: true
        type: string
      core_and_core_pre_only:
        description: Retag Core-pre and Core unchanged before rebuilding Base and above
        type: boolean
        default: false
      core_pre_build_commit:
        description: Core-pre source revision when it differs from build_commit
        type: string
        default: ""
      upper_build_commit:
        description: Source revision for Kachelmann and above; blank uses build_commit
        type: string
        default: ""
concurrency:
  group: fedora45-retag-cascade
  cancel-in-progress: false
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify entire cascade, then copy exact manifests without rebuilding
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          UPPER_BUILD_COMMIT: ${{ inputs.upper_build_commit }}
          CORE_PRE_ONLY: ${{ inputs.core_pre_only }}
          CORE_AND_CORE_PRE_ONLY: ${{ inputs.core_and_core_pre_only }}
          CORE_PRE_BUILD_COMMIT: ${{ inputs.core_pre_build_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$TARGET_TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$SOURCE_TAG" != "$TARGET_TAG" && "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          UPPER_BUILD_COMMIT="${UPPER_BUILD_COMMIT:-$BUILD_COMMIT}"
          [[ "$UPPER_BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          CORE_PRE_BUILD_COMMIT="${CORE_PRE_BUILD_COMMIT:-$BUILD_COMMIT}"
          [[ "$CORE_PRE_BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_PRE_ONLY" != true || "$CORE_AND_CORE_PRE_ONLY" != true ]]
          declare -A digests
          stages=(core-pre core base kachelmann safrano9999 safrano9999-full)
          if [[ "$CORE_PRE_ONLY" == true ]]; then
            stages=(core-pre)
          elif [[ "$CORE_AND_CORE_PRE_ONLY" == true ]]; then
            stages=(core-pre core)
          fi
          for stage in "${stages[@]}"; do
            image="ghcr.io/safrano9999/fedora45-ai-$stage"
            digest="$(docker buildx imagetools inspect "$image:$SOURCE_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            case "$stage" in
              core-pre) revision="$CORE_PRE_BUILD_COMMIT" ;;
              core|base) revision="$BUILD_COMMIT" ;;
              *) revision="$UPPER_BUILD_COMMIT" ;;
            esac
            docker buildx imagetools inspect "$image@$digest" --format '{{json .Image}}' |
              jq -e --arg revision "$revision" '(.config // .["linux/amd64"].config).Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
            digests[$stage]="$digest"
            if docker buildx imagetools inspect "$image:$TARGET_TAG" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing version $image:$TARGET_TAG" >&2
              exit 1
            fi
          done
          for stage in "${stages[@]}"; do
            image="ghcr.io/safrano9999/fedora45-ai-$stage"
            docker buildx imagetools create --prefer-index=false --tag "$image:$TARGET_TAG" "$image@${digests[$stage]}"
            actual="$(docker buildx imagetools inspect "$image:$TARGET_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$actual" == "${digests[$stage]}" ]]
            printf '%s:%s → %s\n' "$image" "$TARGET_TAG" "$actual" >> "$GITHUB_STEP_SUMMARY"
          done
