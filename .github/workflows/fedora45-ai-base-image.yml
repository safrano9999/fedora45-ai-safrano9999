# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora45-ai-base image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      build_commit:
        description: "Exact prepared source commit (40 hex). Empty selects this dispatch's immutable event SHA."
        required: false
        default: ""
        type: string
      build_series:
        description: 'Containerfile series, e.g. 2026.9.17; empty uses Containerfile'
        required: false
        default: ''
        type: string
      image_tag:
        description: "Fixed YYYY.M.N version. Empty selects the next monthly number."
        required: false
        default: ""
      core_tag:
        description: "fedora45-ai-core parent tag. Empty uses build.conf"
        required: false
        default: ""
      replace_existing:
        description: "Explicitly allow replacing the requested fixed tag during an authorized rebuild"
        required: false
        type: boolean
        default: false
      push_latest:
        description: "Also advance latest; false builds a candidate for external verification"
        required: false
        type: boolean
        default: true
      push_stable:
        description: "Explicitly also move :stable to this build"
        required: false
        type: boolean
        default: false
      cascade:
        description: "Build KACHELMANN after Base succeeds"
        required: true
        type: boolean
        default: false
      cascade_target:
        description: "Stop cascade at this image; selected from the prepared source snapshot"
        required: false
        default: ""
        type: string
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora45-ai-base-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Select exact source commit
        id: source
        shell: bash
        env:
          REQUESTED_BUILD_COMMIT: ${{ inputs.build_commit }}
        run: |
          set -euo pipefail
          commit="${REQUESTED_BUILD_COMMIT:-$GITHUB_SHA}"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "build_commit must be a full lowercase Git SHA" >&2
            exit 1
          }
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 1

      - name: Select Containerfile
        id: recipe
        env:
          BUILD_SERIES: ${{ inputs.build_series }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          file="fedora45-ai-base/Containerfile"
          if [ -n "$BUILD_SERIES" ]; then
            [[ "$BUILD_SERIES" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]
            [[ "$REQUESTED_TAG" == "$BUILD_SERIES."* ]]
            [[ "${REQUESTED_TAG#"$BUILD_SERIES."}" =~ ^[0-9]+$ ]]
            file+="$BUILD_SERIES"
          fi
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "CONTAINERFILE=$GITHUB_WORKSPACE/$file" >> "$GITHUB_ENV"
          echo "BUILD_SERIES=$BUILD_SERIES" >> "$GITHUB_ENV"

      - name: Verify source checkout
        shell: bash
        env:
          EXPECTED_BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$EXPECTED_BUILD_COMMIT" ] || {
            echo "Source checkout differs from the selected build commit" >&2
            exit 1
          }
          printf 'Source commit: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          CORE_TAG: ${{ inputs.core_tag || (inputs.build_series != '' && inputs.image_tag) || '' }}
          PUSH_STABLE: ${{ inputs.push_stable }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          set -a
          . fedora45-ai-base/build.conf
          set +a
          core_ref="$AI_CORE_IMAGE"
          [ -z "$CORE_TAG" ] || core_ref="${AI_CORE_IMAGE%:*}:$CORE_TAG"
          image="${FEDORA45_AI_BASE_IMAGE%:*}"
          version="$(.github/scripts/resolve-fedora-image-tag.sh "$image" "$REQUESTED_TAG" "$REPLACE_EXISTING")"

          {
            echo "version=$version"
            echo "core_ref=$core_ref"
            echo "image=$image"
            echo "tags<<EOF"
            echo "${image}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${image}:latest"
            [ "$PUSH_STABLE" != true ] || echo "${image}:stable"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Base
        uses: docker/build-push-action@v6
        with:
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          context: ./fedora45-ai-base
          file: ${{ steps.recipe.outputs.file }}
          target: ai-base
          platforms: linux/amd64
          pull: true
          no-cache: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
            GH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_CORE_IMAGE=${{ steps.refs.outputs.core_ref }}

      - name: Verify consumed CITADEL refactoring on the runner
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.refs.outputs.image }}:${{ steps.refs.outputs.version }}"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            grep CITADEL /README/fedora45-ai-base-source-tags.tsv
            cd /opt/safrano9999/CITADEL
            python3 -m unittest discover -s tests
            node --check index.js
            node --test workers/cloudflare-api/worker.test.mjs
            test -f image/init/citadel-refresh.py
            systemd-analyze verify /etc/systemd/system/citadel.service /etc/systemd/system/citadel-scan.service
          '

      - name: Reclaim space after Base build
        run: .github/scripts/prune-container-build-space.sh

      - name: Test published Base layer
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.refs.outputs.image }}:${{ steps.refs.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 45" /etc/fedora-release
            grep -Fqx "TasksMax=infinity" \
              /etc/systemd/system/openclaw.service
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/openclaw-ephemeral-yolo
            test -x /usr/local/bin/hermes-ephemeral
            test -x /usr/local/bin/persistainer
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            for project in WELCOME CODEANALYST CITADEL DIESDAS- NEXTCLOUD \
              safrano9999-paper; do
              test -d "/opt/safrano9999/$project"
            done
            for project in JUGO VikAI PV_D-A-CH KIWIX_BRIDGE \
              NAPOLEON_HILLS_AI_MASTERMIND_CLASSES \
              SOLANA_AIRGAPPED_DEBIAN_WORKFLOW \
              NaturalGrounding-Tiktok-Ying-Video-Manager \
              DAILYNEWS ZEROINBOX SPANKER KACHELMANN; do
              test ! -e "/opt/safrano9999/$project"
            done
            test -L /README/paper.pdf
            test "$(readlink /README/paper.pdf)" = \
              /opt/safrano9999/safrano9999-paper/paper.pdf
            test -s /README/paper.pdf
            systemctl is-enabled \
              persistainer.service fedora45-ai-init-hooks.service \
              tailscaled.service tailscale-up.service cloudflared.service \
              cockpit.service vditor-notes.service openclaw-config.service \
              openclaw.service openclaw-ephemeral-schedule.service \
              hermes-config.service hermes.service hermes-dashboard.service \
              codeanalyst.service citadel.service citadel-scan.service
            test ! -e /etc/systemd/system/fedora45-ai.service
          '
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.safrano9999.parent" }}' \
              "$image"
          )" = fedora45-ai-core
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = root
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            = '["/sbin/init"]'
          docker buildx imagetools inspect "$image" >/dev/null

      - name: Verify Fedora45 image names and documentation
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --entrypoint python3 \
            "${{ steps.refs.outputs.image }}:${{ steps.refs.outputs.version }}" \
            - < .github/scripts/check-fedora45-image.py

      - name: Trigger kachelmann layer
        if: inputs.cascade && inputs.cascade_target != 'fedora45-ai-base'
        env:
          CASCADE_TARGET: ${{ inputs.cascade_target }}
          BUILD_COMMIT: ${{ steps.source.outputs.commit }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.refs.outputs.version }}
          PUSH_STABLE: ${{ inputs.push_stable }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run fedora45-ai-kachelmann-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f "build_commit=$BUILD_COMMIT" \
            -f "build_series=$BUILD_SERIES" \
            -f "image_tag=$IMAGE_TAG" \
            -f "base_tag=$IMAGE_TAG" \
            -f "push_stable=$PUSH_STABLE" \
            -f "push_latest=$PUSH_LATEST" \
            -f "replace_existing=$REPLACE_EXISTING" \
            -f "cascade=true" \
            -f "cascade_target=$CASCADE_TARGET" \
            -f "monitor_id=${{ inputs.monitor_id }}" \
            -f "monitor_final=${{ inputs.cascade_target == 'fedora45-ai-kachelmann' || (inputs.cascade_target == '' && 'fedora45-ai-kachelmann' == 'fedora45-ai-safrano9999-full') }}"
