  full:
    name: Build ARM64 full
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.safrano9999.result == 'success' || inputs.start_layer == 'full') }}
    needs: [resolve, safrano9999]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CASCADE_TAG: ${{ needs.resolve.outputs.version }}
      EXPECTED_OPENCLAW_VERSION: ${{ needs.resolve.outputs.openclaw_version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/login-action@v3
        with:
