# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora45-ai ARM64 cascade
on:
  workflow_dispatch:
    inputs:
      build_series:
        description: "Empty selects the normal line; 2026.9.17 retains the historical recipes"
        type: string
        default: ""
      image_tag:
        description: "Fixed image version; empty selects the next revision for the selected line"
        type: string
        default: ""
      start_layer:
        description: "Resume an unpublished layer using image_tag and its already published parent"
        type: choice
        options: [core, base, kachelmann, safrano9999, full]
        default: core
      core_pre_tag:
        description: "Existing ARM64 Core-pre foundation; this workflow starts at Core"
        type: string
        default: "2026.9.17.28"
      publish_latest:
        description: "Advance the ARM64 latest tags"
        type: boolean
        default: true
concurrency:
  group: fedora45-ai-arm64-cascade
  cancel-in-progress: false
env:
  BUILD_SERIES: ${{ inputs.build_series }}
jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      openclaw_version: ${{ steps.version.outputs.openclaw_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve unused shared series revision
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          START_LAYER: ${{ inputs.start_layer }}
        run: |
          set -euo pipefail
          [[ "$START_LAYER" = core || -n "$REQUESTED_TAG" ]] || { echo "Resuming requires image_tag" >&2; exit 1; }
          version="$(.github/scripts/resolve-fedora-image-tag.sh "ghcr.io/safrano9999/fedora45-ai-arm64-$START_LAYER" "$REQUESTED_TAG")"
          [[ "$version" =~ ^20[0-9]{2}[.][0-9]+[.][0-9]+([.][0-9]+)?$ ]]
          if [ -n "$BUILD_SERIES" ]; then [[ "$version" == "$BUILD_SERIES."* ]]; fi
          runtime="$(sed -n 's/^ARG OPENCLAW_VERSION=//p' "fedora45-ai-core/Containerfile${BUILD_SERIES}")"
          [[ "$runtime" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "openclaw_version=$runtime" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  core:
    name: Build ARM64 core
    if: inputs.start_layer == 'core'
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CASCADE_TAG: ${{ needs.resolve.outputs.version }}
      EXPECTED_OPENCLAW_VERSION: ${{ needs.resolve.outputs.openclaw_version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-core
          file: ./fedora45-ai-core/Containerfile${{ inputs.build_series }}
          target: ai-core
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
            GH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/safrano9999/fedora45-ai-arm64-core:${{ env.CASCADE_TAG }}
            ghcr.io/safrano9999/fedora45-ai-core-arm64:${{ env.CASCADE_TAG }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-arm64-core:latest' || '' }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-core-arm64:latest' || '' }}
          build-args: |
            AI_CORE_PRE_IMAGE=ghcr.io/safrano9999/fedora45-ai-arm64-core-pre:${{ inputs.core_pre_tag }}
      - name: Reclaim build cache
        run: .github/scripts/prune-container-build-space.sh
      - name: Verify installed runtime on native ARM64
        run: |
          docker run --rm -e EXPECTED_OPENCLAW_VERSION --entrypoint bash ghcr.io/safrano9999/fedora45-ai-arm64-core:"$CASCADE_TAG" -lc '
            set -euo pipefail
            test "$(uname -m)" = aarch64
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" = "$EXPECTED_OPENCLAW_VERSION"
            test -x /opt/safrano9999/litellm-free/ops/refresh-models.sh
            openclaw-ephemeral.py configure
            openclaw config validate
            python3 -m pip check
            for plugin in brave codex mai-transcribe speaches; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
          '
  base:
    name: Build ARM64 base
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.core.result == 'success' || inputs.start_layer == 'base') }}
    needs: [resolve, core]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CASCADE_TAG: ${{ needs.resolve.outputs.version }}
      EXPECTED_OPENCLAW_VERSION: ${{ needs.resolve.outputs.openclaw_version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-base
          file: ./fedora45-ai-base/Containerfile${{ inputs.build_series }}
          target: ai-base
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
            GH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/safrano9999/fedora45-ai-arm64-base:${{ env.CASCADE_TAG }}
            ghcr.io/safrano9999/fedora45-ai-base-arm64:${{ env.CASCADE_TAG }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-arm64-base:latest' || '' }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-base-arm64:latest' || '' }}
          build-args: |
            AI_CORE_IMAGE=ghcr.io/safrano9999/fedora45-ai-arm64-core:${{ env.CASCADE_TAG }}
      - name: Reclaim build cache
        run: .github/scripts/prune-container-build-space.sh
      - name: Verify installed runtime on native ARM64
        run: |
          docker run --rm -e EXPECTED_OPENCLAW_VERSION --entrypoint bash ghcr.io/safrano9999/fedora45-ai-arm64-base:"$CASCADE_TAG" -lc '
            set -euo pipefail
            test "$(uname -m)" = aarch64
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" = "$EXPECTED_OPENCLAW_VERSION"
            test -x /opt/safrano9999/litellm-free/ops/refresh-models.sh
            openclaw-ephemeral.py configure
            openclaw config validate
            python3 -m pip check
            for plugin in brave codex mai-transcribe speaches; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
          '
  kachelmann:
    name: Build ARM64 kachelmann
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.base.result == 'success' || inputs.start_layer == 'kachelmann') }}
    needs: [resolve, base]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CASCADE_TAG: ${{ needs.resolve.outputs.version }}
      EXPECTED_OPENCLAW_VERSION: ${{ needs.resolve.outputs.openclaw_version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage Kachelmann APK
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          mkdir -p fedora45-ai-kachelmann/safrano9999/KACHELMANN
          python3 .github/scripts/stage-kachelmann-apk.py --destination fedora45-ai-kachelmann/safrano9999/KACHELMANN
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-kachelmann
          file: ./fedora45-ai-kachelmann/Containerfile${{ inputs.build_series }}
          target: ai-kachelmann
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
            GH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/safrano9999/fedora45-ai-arm64-kachelmann:${{ env.CASCADE_TAG }}
            ghcr.io/safrano9999/fedora45-ai-kachelmann-arm64:${{ env.CASCADE_TAG }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-arm64-kachelmann:latest' || '' }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-kachelmann-arm64:latest' || '' }}
          build-args: |
            AI_BASE_IMAGE=ghcr.io/safrano9999/fedora45-ai-arm64-base:${{ env.CASCADE_TAG }}
      - name: Reclaim build cache
        run: .github/scripts/prune-container-build-space.sh
      - name: Verify installed runtime on native ARM64
        run: |
          docker run --rm -e EXPECTED_OPENCLAW_VERSION --entrypoint bash ghcr.io/safrano9999/fedora45-ai-arm64-kachelmann:"$CASCADE_TAG" -lc '
            set -euo pipefail
