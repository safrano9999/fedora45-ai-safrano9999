            test -x /opt/safrano9999/litellm-free/ops/refresh-models.sh
            openclaw-ephemeral.py configure
            openclaw config validate
            python3 -m pip check
            for plugin in brave codex mai-transcribe speaches; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
          '
  safrano9999:
    name: Build ARM64 safrano9999
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.kachelmann.result == 'success' || inputs.start_layer == 'safrano9999') }}
    needs: [resolve, kachelmann]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CASCADE_TAG: ${{ needs.resolve.outputs.version }}
      EXPECTED_OPENCLAW_VERSION: ${{ needs.resolve.outputs.openclaw_version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-safrano9999
          file: ./fedora45-ai-safrano9999/Containerfile${{ inputs.build_series }}
          target: ai-safrano9999
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
            GH_TOKEN=${{ secrets.GH_RELEASE_TOKEN || github.token }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/safrano9999/fedora45-ai-arm64-safrano9999:${{ env.CASCADE_TAG }}
            ghcr.io/safrano9999/fedora45-ai-safrano9999-arm64:${{ env.CASCADE_TAG }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-arm64-safrano9999:latest' || '' }}
            ${{ inputs.publish_latest && 'ghcr.io/safrano9999/fedora45-ai-safrano9999-arm64:latest' || '' }}
          build-args: |
            AI_KACHELMANN_IMAGE=ghcr.io/safrano9999/fedora45-ai-arm64-kachelmann:${{ env.CASCADE_TAG }}
      - name: Reclaim build cache
        run: .github/scripts/prune-container-build-space.sh
      - name: Verify installed runtime on native ARM64
        run: |
          docker run --rm -e EXPECTED_OPENCLAW_VERSION --entrypoint bash ghcr.io/safrano9999/fedora45-ai-arm64-safrano9999:"$CASCADE_TAG" -lc '
            set -euo pipefail
            test "$(uname -m)" = aarch64
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" = "$EXPECTED_OPENCLAW_VERSION"
            test -x /opt/safrano9999/litellm-free/ops/refresh-models.sh
            openclaw-ephemeral.py configure
            openclaw config validate
            python3 -m pip check
            for plugin in brave codex mai-transcribe speaches; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
