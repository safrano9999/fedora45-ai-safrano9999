# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora45-ai-core image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Fixed YYYY.M.N version. Empty selects the next monthly number."
        required: false
        default: ""
      core_pre_tag:
        description: "fedora45-ai-core-pre parent tag. Empty uses build.conf"
        required: false
        default: ""
      push_latest:
        description: "Also advance latest; false builds a candidate for external verification"
        required: false
        type: boolean
        default: true
      push_stable:
        description: "Explicitly also move :stable to this build"
        required: false
        type: boolean
        default: false
      cascade:
        description: "Build the remaining chain after Core succeeds"
        required: true
        type: boolean
        default: false
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora45-ai-core-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          CORE_PRE_TAG: ${{ inputs.core_pre_tag }}
          PUSH_STABLE: ${{ inputs.push_stable }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          set -a
          . fedora45-ai-core/build.conf
          set +a
          pre_ref="$AI_CORE_PRE_IMAGE"
          [ -z "$CORE_PRE_TAG" ] || pre_ref="${AI_CORE_PRE_IMAGE%:*}:$CORE_PRE_TAG"
          image="${FEDORA45_AI_CORE_IMAGE%:*}"
          version="$(.github/scripts/resolve-fedora-image-tag.sh "$image" "$REQUESTED_TAG")"
          {
            echo "version=$version"
            echo "pre_ref=$pre_ref"
            echo "image=$image"
            echo "tags<<EOF"
            echo "${image}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${image}:latest"
            [ "$PUSH_STABLE" != true ] || echo "${image}:stable"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare ephemeral Core inputs
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          cd fedora45-ai-core
          ./build/prepare-build-context.sh
          set -a
          . ./build.conf
          set +a
          for name in OPENCLAW_VERSION NOTE_REPOSITORY NOTE_RELEASE_TAG \
            NOTE_RELEASE_ASSET NOTE_RELEASE_SHA256; do
            [ -n "${!name:-}" ] || {
              echo "Missing required build input: $name" >&2
              exit 1
            }
          done
          for name in NOTE_RELEASE_SHA256; do
            [[ "${!name}" =~ ^[0-9a-f]{64}$ ]] || {
              echo "$name must be a lowercase SHA256" >&2
              exit 1
            }
          done

          vendor_files=(
            build/vendor/openclaw-deterministic/openclaw-deterministic.tar.gz
            build/vendor/note/note-latest.zip
            build/vendor/openclaw-ephemeral/openclaw-ephemeral.py
            build/vendor/openclaw-ephemeral/runtime/yolo.sh
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/__init__.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/cli.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/configuration.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/environment.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/filesystem.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/plugins.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/providers.py
            build/vendor/openclaw-ephemeral/openclaw_ephemeral/scheduling.py
            build/vendor/openclaw-ephemeral/image/runtime/etc/systemd/system/openclaw-config.service
            build/vendor/openclaw-ephemeral/image/runtime/etc/systemd/system/openclaw-ephemeral-schedule.service
            build/vendor/hermes-ephemeral/image/runtime/usr/local/bin/hermes-ephemeral
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/__init__.py
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/cli.py
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/configuration.py
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/environment.py
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/mcp.py
            build/vendor/hermes-ephemeral/image/runtime/usr/local/lib/hermes-ephemeral/hermes_ephemeral/providers.py
            build/vendor/hermes-ephemeral/image/runtime/etc/systemd/system/hermes-ephemeral.service
          )
          for file in "${vendor_files[@]}"; do
            [ -s "$file" ] || {
              echo "Missing staged vendor file: $file" >&2
              exit 1
            }
          done
          [ "$(find build/vendor/openclaw-ephemeral -type f | wc -l)" -eq 12 ] || {
            echo "Unexpected openclaw-ephemeral vendor file set" >&2
            exit 1
          }
          [ "$(find build/vendor/hermes-ephemeral -type f | wc -l)" -eq 8 ] || {
            echo "Unexpected hermes-ephemeral vendor file set" >&2
            exit 1
          }
          {
            echo "openclaw_version=$OPENCLAW_VERSION"
            echo "build_args<<EOF"
            echo "OPENCLAW_VERSION=$OPENCLAW_VERSION"
            echo "NOTE_REPOSITORY=$NOTE_REPOSITORY"
            echo "NOTE_RELEASE_TAG=$NOTE_RELEASE_TAG"
            echo "NOTE_RELEASE_ASSET=$NOTE_RELEASE_ASSET"
            echo "NOTE_RELEASE_SHA256=$NOTE_RELEASE_SHA256"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-core
          file: ./fedora45-ai-core/Containerfile
          target: ai-core
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_CORE_PRE_IMAGE=${{ steps.refs.outputs.pre_ref }}
            ${{ steps.build.outputs.build_args }}

      - name: Reclaim container build space
        run: .github/scripts/prune-container-build-space.sh

      - name: Test published image
        env:
          IMAGE_TAG: ${{ steps.refs.outputs.version }}
          EXPECTED_OPENCLAW_VERSION: ${{ steps.build.outputs.openclaw_version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.refs.outputs.image }}:${IMAGE_TAG}"
          docker pull "$image"
          docker run --rm \
            -e EXPECTED_OPENCLAW_VERSION \
            --entrypoint bash \
            "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 45" /etc/fedora-release
            grep -Fqx "TasksMax=infinity" \
              /etc/systemd/system/openclaw.service
            for command in node npm python3 pip uv codex claude openclaw \
              hermes webhook cloudflared git gh jq tailscale cockpit-bridge \
              nmap lnd lncli geth solana; do
              command -v "$command" >/dev/null
            done
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" \
              = "$EXPECTED_OPENCLAW_VERSION"
            test -s "$(npm root -g)/openclaw/dist/control-ui/index.html"
            test -f /usr/local/lib/vditor/dist/index.min.js
            test -f /usr/local/lib/vditor-notes/app.py
            test -f /usr/local/share/bip39/index.html
            test -x /usr/local/bin/electrum
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/openclaw-ephemeral-yolo
            test -x /usr/local/bin/hermes-ephemeral
            test -x /usr/local/bin/persistainer
            test -x /usr/local/bin/fedora44-ai-init-hooks
            test -x /usr/local/libexec/fedora44-wait-ready
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            note_python="$("/root/.openclaw/extensions/note/scripts/setup-python.sh")"
            test -x "$note_python"
            "$note_python" -c "import dotenv, sqlalchemy, psycopg, pymysql"
            PYTHONPATH=/usr/local/lib/openclaw-ephemeral:/usr/local/lib/hermes-ephemeral \
              python3 -c "import yaml; import openclaw_ephemeral; import hermes_ephemeral"
            for unit in persistainer.service fedora44-ai-init-hooks.service \
              tailscaled.service \
              tailscale-up.service cockpit.service bip39.service vditor-notes.service \
              openclaw-config.service openclaw.service \
              openclaw-ephemeral-schedule.service hermes-ephemeral.service \
              hermes.service \
              hermes-dashboard.service; do
              test -f "/etc/systemd/system/$unit" \
                || test -f "/usr/lib/systemd/system/$unit"
              systemctl is-enabled "$unit"
            done
            test "$(systemctl is-enabled cockpit.socket)" = masked
            for legacy in /usr/local/bin/fedora44-ai-init \
              /usr/local/bin/hermes-ephemeral.py \
              /usr/local/bin/named_volume_links.sh \
              /usr/local/bin/named_volume_links_openclaw.sh \
              /usr/local/bin/named_volume_links_hermes.sh \
              /etc/systemd/system/fedora44-ai.service; do
              test ! -e "$legacy"
            done
            test ! -e /opt/safrano9999
          '
          docker run --rm \
            --entrypoint bash \
            "$image" -lc '
            set -euo pipefail
            if ! /usr/local/bin/openclaw-ephemeral.py configure; then
              # This default fixture receives no runtime credentials.
              openclaw config validate || true
              openclaw plugins registry --refresh || true
              exit 1
            fi
            openclaw config validate
          '
          docker run --rm \
            -e MCP_SERVER_URL=http://kachelmann-mcp:11041/mcp \
            -e MCP_SERVER_BEARER=workflow-hermes-secret \
            -e MCP_SERVER_NAME_02=paperless-mcp \
            -e MCP_SERVER_URL_02=http://paperless-mcp:5000/mcp \
            --entrypoint python3 \
            "$image" -c '
          import json
          import os
          import sys

          sys.path.insert(0, "/usr/local/lib/hermes-ephemeral")
          from hermes_ephemeral.mcp import mcp_servers_config

          servers = mcp_servers_config(os.environ)
          assert set(servers) == {"kachelmann-mcp", "paperless-mcp"}
          assert servers["kachelmann-mcp"]["headers"]["Authorization"] == (
              "Bearer ${MCP_SERVER_BEARER}"
          )
          assert servers["kachelmann-mcp"]["supports_parallel_tool_calls"] is True
          assert "tools" not in servers["kachelmann-mcp"]
          assert "headers" not in servers["paperless-mcp"]
          assert "workflow-hermes-secret" not in json.dumps(servers)
          '
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = root
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            = '["/sbin/init"]'
          test "$(docker image inspect --format '{{.Config.StopSignal}}' "$image")" \
            = 'SIGRTMIN+3'
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.safrano9999.parent" }}' \
              "$image"
          )" = fedora45-ai-core-pre
          docker buildx imagetools inspect "$image" >/dev/null

      - name: Verify private GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.github.com/user/packages/container/fedora45-ai-core"
          verified=false
          for _ in {1..20}; do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$package_url" \
              | jq -e '.name == "fedora45-ai-core" and .visibility == "private"' \
                >/dev/null; then
              verified=true
              break
            fi
            sleep 3
          done
          [ "$verified" = true ]

      - name: Trigger Base cascade
        if: inputs.cascade
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.refs.outputs.version }}
          PUSH_STABLE: ${{ inputs.push_stable }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run fedora45-ai-base-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f "image_tag=$IMAGE_TAG" \
            -f "core_tag=$IMAGE_TAG" \
            -f "push_stable=$PUSH_STABLE" \
            -f "push_latest=$PUSH_LATEST" \
            -f "cascade=true" \
            -f "monitor_id=${{ inputs.monitor_id }}" \
            -f "monitor_final=false"
