name: Fedora 45 AI multi-architecture manifests

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing version tag published by both architecture cascades"
        required: true
        default: "2026.9.17.28"
        type: string
      publish_latest:
        description: "Also publish the multi-architecture latest tags"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora45-ai-multiarch-manifest
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/safrano9999

jobs:
  publish:
    name: Publish multi-architecture manifests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Combine verified amd64 and arm64 manifests
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]

          declare -A images=(
            [core-pre]="fedora45-ai-core-pre"
            [core]="fedora45-ai-core"
            [base]="fedora45-ai-base"
            [kachelmann]="fedora45-ai-kachelmann"
            [safrano9999]="fedora45-ai-safrano9999"
            [full]="fedora45-ai-safrano9999-full"
          )
          declare -A arm_images=(
            [core-pre]="fedora45-ai-arm64-core-pre"
            [core]="fedora45-ai-arm64-core"
            [base]="fedora45-ai-arm64-base"
            [kachelmann]="fedora45-ai-arm64-kachelmann"
            [safrano9999]="fedora45-ai-arm64-safrano9999"
            [full]="fedora45-ai-arm64-full"
          )

          # Resolve every stage before moving any generic/latest reference.
          declare -A amd_digests arm_digests
          for stage in core-pre core base kachelmann safrano9999 full; do
            generic="${REGISTRY}/${images[$stage]}"
            amd64="${generic}-amd64"
            arm64="${REGISTRY}/${arm_images[$stage]}"
            amd_digest="$(docker buildx imagetools inspect "$amd64:$SOURCE_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            arm_digest="$(docker buildx imagetools inspect "$arm64:$SOURCE_TAG" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$amd_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$arm_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            amd_digests[$stage]="$amd_digest"
            arm_digests[$stage]="$arm_digest"
          done

          for stage in core-pre core base kachelmann safrano9999 full; do
            generic="${REGISTRY}/${images[$stage]}"
            amd64="${generic}-amd64"
            arm64="${REGISTRY}/${arm_images[$stage]}"
            amd_digest="${amd_digests[$stage]}"
            arm_digest="${arm_digests[$stage]}"

            tags=(--tag "$generic:$SOURCE_TAG")
            if [[ "$PUBLISH_LATEST" == true ]]; then
              tags+=(--tag "$generic:latest")
            fi
            # Version and latest must refer to the same two verified builds.
            docker buildx imagetools create "${tags[@]}" \
              "$amd64@$amd_digest" "$arm64@$arm_digest"

            docker buildx imagetools inspect "$generic:$SOURCE_TAG" --raw \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort == ["amd64", "arm64"]' >/dev/null
            if [[ "$PUBLISH_LATEST" == true ]]; then
              docker buildx imagetools create --prefer-index=false --tag "$amd64:latest" "$amd64@$amd_digest"
              docker buildx imagetools create --prefer-index=false --tag "$arm64:latest" --tag "$generic-arm64:latest" "$arm64@$arm_digest"
            fi
            printf '%s: amd64 + arm64 → %s:%s\n' "$stage" "$generic" "$SOURCE_TAG" >> "$GITHUB_STEP_SUMMARY"
          done
