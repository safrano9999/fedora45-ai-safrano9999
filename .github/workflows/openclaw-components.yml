# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: OpenClaw components
run-name: 'OpenClaw components [components:${{ inputs.run_id }}]'

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Correlation ID for the invoking preparation run
        type: string
        default: manual
      publish:
        description: Publish changed, verified components and update Core pins (no image build)
        type: boolean
        default: true
      target_version:
        description: Optional OpenClaw version to build before Core-pre is updated
        type: string
        required: false
        default: ''
      allow_downgrade:
        description: Explicitly allow a manually requested Core-pre downgrade
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: openclaw-components
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      patch_sha: ${{ steps.source.outputs.patch_sha }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          sha=$(gh api repos/safrano9999/openclaw-deterministic-latest/commits/main --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "patch_sha=$sha" >> "$GITHUB_OUTPUT"

  components:
    needs: source
    uses: safrano9999/openclaw-deterministic-latest/.github/workflows/verify-and-release.yml@main
    with:
      core_source_commit: ${{ github.sha }}
      patch_source_commit: ${{ needs.source.outputs.patch_sha }}
      target_version: ${{ inputs.target_version }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets:
      source_token: ${{ secrets.GH_RELEASE_TOKEN }}

  record:
    needs: components
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - name: Record the verified runtime without starting an image build
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.components.outputs.release_tag }}
          OPENCLAW_VERSION: ${{ needs.components.outputs.version }}
          OPENCLAW_UPSTREAM_SHA: ${{ needs.components.outputs.upstream_sha }}
          TARGET_OPENCLAW_VERSION: ${{ inputs.target_version }}
          ALLOW_OPENCLAW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          python3 .github/scripts/record-openclaw-release.py
          if git diff --quiet -- fedora45-ai-core/build.conf fedora45-ai-core-pre/Containerfile; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fedora45-ai-core/build.conf fedora45-ai-core-pre/Containerfile
          git commit -m 'Pin verified OpenClaw runtime [skip ci]'
          # A concurrent Core edit must never be overwritten; the next run retries.
          git push origin HEAD:main
