# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora45-ai-safrano9999-full image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Fixed YYYY.M.N version. Empty selects the next monthly number."
        required: false
        default: ""
      safrano9999_tag:
        description: "fedora45-ai-safrano9999 parent tag. Empty uses build.conf"
        required: false
        default: ""
      push_latest:
        description: "Also advance latest; false builds a candidate for external verification"
        required: false
        type: boolean
        default: true
      push_stable:
        description: "Explicitly also move :stable to this build"
        required: false
        type: boolean
        default: false
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora45-ai-safrano9999-full-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SAFRANO9999_TAG: ${{ inputs.safrano9999_tag }}
          PUSH_STABLE: ${{ inputs.push_stable }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          set -a
          . fedora45-ai-safrano9999-full/build.conf
          set +a
          safrano9999_ref="$AI_SAFRANO9999_IMAGE"
          [ -z "$SAFRANO9999_TAG" ] || safrano9999_ref="${AI_SAFRANO9999_IMAGE%:*}:$SAFRANO9999_TAG"
          image="${FEDORA45_AI_SAFRANO9999_FULL_IMAGE%:*}"
          version="$(.github/scripts/resolve-fedora-image-tag.sh "$image" "$REQUESTED_TAG")"

          {
            echo "version=$version"
            echo "safrano9999_ref=$safrano9999_ref"
            echo "image=$image"
            echo "tags<<EOF"
            echo "${image}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${image}:latest"
            [ "$PUSH_STABLE" != true ] || echo "${image}:stable"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure source authentication
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: gh auth setup-git

      - name: Prepare Safrano Full build context
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: fedora45-ai-safrano9999-full/build/prepare-build-context.sh --no-cache

      - name: Resolve Safrano Full build configuration
        id: safrano_build
        shell: bash
        run: |
          set -euo pipefail
          resolved=fedora45-ai-safrano9999-full/.resolved-build.env
          [ -s "$resolved" ] || {
            echo "Missing $resolved" >&2
            exit 1
          }
          {
            echo "build_args<<EOF"
            cat "$resolved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Safrano Full layer
        uses: docker/build-push-action@v6
        with:
          context: ./fedora45-ai-safrano9999-full
          file: ./fedora45-ai-safrano9999-full/Containerfile
          target: ai-safrano9999-full
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_SAFRANO9999_IMAGE=${{ steps.refs.outputs.safrano9999_ref }}
            ${{ steps.safrano_build.outputs.build_args }}

      - name: Reclaim space after Safrano Full build
        run: .github/scripts/prune-container-build-space.sh

      - name: Test published Safrano Full layer
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.refs.outputs.image }}:${{ steps.refs.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash \
            "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 45" /etc/fedora-release
            grep -Fqx "TasksMax=infinity" \
              /etc/systemd/system/openclaw.service
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/openclaw-ephemeral-yolo
            test -x /usr/local/bin/hermes-ephemeral
            test -x /usr/local/bin/persistainer
            /usr/local/lib/hermes-agent/venv/bin/python -c "import sqlalchemy"
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            test -d /opt/safrano9999/VikAI
            test -d /opt/safrano9999/KACHELMANN
            test -d /opt/safrano9999/ZEROINBOX
            test -x /usr/local/bin/vikai-bootstrap-openclaw-agents
            systemctl is-enabled vikai-bootstrap-openclaw-agents.service openclaw.service
            test ! -e /etc/systemd/system/fedora44-ai.service
          '
          docker run --rm -i --network none --entrypoint python3 "$image" \
            < .github/scripts/smoke-vikai-agents.py
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.safrano9999.parent" }}' \
              "$image"
          )" = fedora45-ai-safrano9999
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = root
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            = '["/sbin/init"]'
          docker buildx imagetools inspect "$image" >/dev/null
