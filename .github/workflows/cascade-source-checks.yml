# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Cascade source checks
on:
  push:
    branches: [main, 'update/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify runtime and installer contracts
        run: |
          set -euo pipefail
          for tests in fedora45-ai-*/tests; do
            [ ! -d "$tests" ] || python3 -m unittest discover -s "$tests" -p 'test_*.py' -v
          done
          node --test fedora45-ai-core/tests/*.test.mjs fedora45-ai-core/tests/*.test.cjs
          python3 .github/scripts/test-resolve-fedora-image-tag.py
          python3 -m unittest discover -s upgrade-loop/tests -v
          npm ci --prefix upgrade-loop/n8n-sources --ignore-scripts --no-audit --no-fund
          node --test upgrade-loop/tests/*.cjs
          git diff --exit-code

  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_prefix: ${{ runner.temp }}/openclaw
      HOME: ${{ runner.temp }}/plugin-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Check direct plugins and TTS integration against the installed release
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          export PATH="$npm_config_prefix/bin:$PATH"
          version="$(sed -n 's/^ARG OPENCLAW_VERSION=//p' fedora45-ai-core/Containerfile)"
          npm install -g --omit=dev --no-audit --no-fund "openclaw@$version"
          for plugin in brave-plugin codex; do
            openclaw plugins install --force --accept-capabilities --pin "npm:@openclaw/$plugin@$version"
          done
          for plugin in mai-transcribe speaches; do
            openclaw plugins install --force --accept-capabilities "$PWD/fedora45-ai-core/build/voice-plugins/$plugin"
          done
          python3 fedora45-ai-core/image/runtime/usr/local/libexec/openclaw-tts-provider-order.py
          openclaw plugins registry --refresh
          for plugin in brave codex mai-transcribe speaches; do
            openclaw plugins inspect "$plugin" --json
          done
