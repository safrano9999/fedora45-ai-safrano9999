# Rootless Podman already supplies the mount/IPC isolation. Nested mount
# namespaces are unavailable here; use dedicated users and retain seccomp.
[Service]
DynamicUser=no
User=cockpit-ws-https
NoNewPrivileges=yes
# Workers never change capabilities; also avoids systemd retaining unavailable
# CAP_SYS_ADMIN while installing seccomp after the unprivileged user switch.
SystemCallFilter=~capset
CapabilityBoundingSet=
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectControlGroups=no
PrivateIPC=no
