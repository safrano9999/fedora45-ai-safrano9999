# Private runtime package staged from the authenticated main branch.
PERSISTAINER_REPOSITORY=safrano9999/persistainer
PERSISTAINER_REF=main

HERMES_VERSION=$(sed -n 's/^ARG HERMES_VERSION=//p' "$(dirname -- "${BASH_SOURCE[0]}")/Containerfile")

ELECTRUM_VERSION=4.8.1
LND_VERSION=v0.21.3-beta
GETH_VERSION=1.17.5
GETH_COMMIT=9621c6ad

WEBHOOK_VERSION=2.8.3
VDITOR_VERSION=4.0.0
OPENCLAW_VERSION=$(sed -n 's/^ARG OPENCLAW_VERSION=//p' "$(dirname -- "${BASH_SOURCE[0]}")/Containerfile")
# Match the Brave plugin API to the pinned OpenClaw runtime.
OPENCLAW_BRAVE_PLUGIN_VERSION=$OPENCLAW_VERSION

FEDORA45_AI_CORE_PRE_IMAGE=${FEDORA45_AI_CORE_PRE_IMAGE:-ghcr.io/safrano9999/fedora45-ai-core-pre:latest}
