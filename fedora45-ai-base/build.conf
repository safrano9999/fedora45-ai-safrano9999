# Parent image for local builds. CI pins the matching published Core tag.
AI_CORE_IMAGE=ghcr.io/safrano9999/fedora45-ai-core:latest
FEDORA45_AI_BASE_IMAGE=${FEDORA45_AI_BASE_IMAGE:-ghcr.io/safrano9999/fedora45-ai-base:latest}

# Runtime roles for the sources declared directly in Containerfile (CSV).
EXTENSIONS="WELCOME,CITADEL,NEXTCLOUD"
STANDALONE="CODEANALYST,DIESDAS-,safrano9999-paper"

# ARM64 bundles are built and released by DIESDAS on GitHub's ARM runner.
# The image workflow passes these values through; x86 builds skip the installer.
ARM64_TOOLCHAINS_RELEASE=arm64-electrum-4.8.2-agave-4.3.2
ARM64_ELECTRUM_VERSION=4.8.2
ARM64_AGAVE_VERSION=v4.3.2
ARM64_ELECTRUM_SHA256=
ARM64_AGAVE_SHA256=
